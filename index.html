<!DOCTYPE html>
<html lang="fa" dir="rtl" data-bs-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>آلمانی A1 – تمرین کلاس</title>
  <meta name="description" content="تمرین عبارت‌ها، صرف فعل، اعداد، الفبا و تلفظ آلمانی برای سطح A1 (کتاب Starten wir)">
  <meta name="theme-color" content="#e5173f">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Deutsch A1">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/icon-180.png">
  <script>
    /* apply saved/system theme before first paint (no flash) */
    (function () {
      try {
        var t = localStorage.getItem('theme');
        document.documentElement.setAttribute('data-bs-theme',
          t || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="assets/vendor/bootstrap.rtl.min.css">
  <link rel="stylesheet" href="assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/vendor/fonts/fonts.css">
  <link rel="stylesheet" href="css/app.css">
</head>
<body>
  <main class="container app-main">
    <header class="hero rounded-4 text-white p-4 mb-3">
      <div class="d-flex justify-content-between align-items-start">
        <div>
          <h1 class="h2 fw-bold mb-1"><i class="bi bi-translate"></i> آلمانی از صفر</h1>
          <p class="mb-0 small opacity-75" dir="ltr">Starten wir A1 · تمرین کلاس</p>
        </div>
        <a class="btn btn-sm btn-outline-light rounded-circle" href="https://github.com/m1chtv"
           target="_blank" rel="noopener" aria-label="GitHub"><i class="bi bi-github"></i></a>
      </div>
      <div class="d-flex flex-wrap gap-2 mt-3">
        <button class="btn btn-sm btn-outline-light rounded-pill" id="btn-slow" aria-pressed="false">
          <i class="bi bi-hourglass-split"></i> تلفظ آهسته</button>
        <button class="btn btn-sm btn-outline-light rounded-pill" id="btn-hide" aria-pressed="false">
          <i class="bi bi-eye-slash-fill"></i> پنهان‌کردن ترجمه</button>
        <button class="btn btn-sm btn-outline-light rounded-pill" id="btn-theme">
          <i class="bi bi-moon-stars-fill"></i> <span>حالت تیره</span></button>
        <button class="btn btn-sm btn-warning rounded-pill d-none" id="btn-install">
          <i class="bi bi-download"></i> نصب اپ</button>
      </div>
    </header>

    <div id="view" class="fade-in"></div>

    <footer class="text-center small text-body-secondary mt-4">
      ساخته‌شده با <i class="bi bi-heart-fill text-danger"></i> ·
      <a class="link-secondary" href="https://github.com/m1chtv" target="_blank" rel="noopener">github.com/m1chtv</a>
    </footer>
  </main>

  <nav class="tabbar fixed-bottom" id="tabbar" aria-label="بخش‌ها"></nav>

  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
